apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
android {
    //noinspection GradleCompatible
    compileSdkVersion 35
    buildToolsVersion "29.0.2"
    namespace "com.suguna.lbsalesperson"
    defaultConfig {
        applicationId "com.suguna.lbsalesperson"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 40
        versionName "3.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        useLibrary 'org.apache.http.legacy'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation files('libs/http-core-4.1.jar')
    implementation files('libs/httpclient-4.2.3.jar')
    implementation files('libs/httpmime-4.3.jar')
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    implementation 'androidx.privacysandbox.tools:tools-core:1.0.0-alpha13'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.google.firebase:firebase-analytics:17.2.2'
    implementation 'com.google.firebase:firebase-messaging:20.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.annotation:annotation:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    implementation 'com.github.Cloudist:ACProgressLite:1.2.1'
    implementation 'com.github.TutorialsAndroid:KAlertDialog:v4.1'
    implementation "androidx.core:core-ktx:1.6.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.0.0"
    //implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    //Network
    implementation 'com.android.volley:volley:1.2.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    //Image Loader
    implementation 'com.squareup.picasso:picasso:2.71828'
    //Io
    implementation 'org.apache.commons:commons-lang3:3.6'
    //charts
   // implementation 'com.github.AAChartModel:AAChartCore-Kotlin:-SNAPSHOT'
    //implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.6.0"))
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
